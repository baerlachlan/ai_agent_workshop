name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bedtools (the oracle)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bedtools
          bedtools --version

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Unit tests need no packages at all -- they are base R. Only the linter
      # pulls anything in, which is why it is installed separately and last.
      - name: Unit tests (no bedtools needed)
        run: ./tests/run_unit.sh

      - name: Golden tests (diffed against real bedtools)
        run: ./tests/run_golden.sh

      - name: Install lintr
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::lintr
          cache-version: 1

      # Config lives in .lintr. Exceptions there are deliberate: object_usage is
      # off because subcommands source their helpers from R/bed.R and lintr
      # cannot see across that, and tests/ gets latitude that R/ does not.
      - name: Lint
        run: |
          Rscript -e '
            l <- lintr::lint_dir(".", pattern = "([.]R|mytools)$")
            print(l)
            quit(status = if (length(l)) 1 else 0)
          '
